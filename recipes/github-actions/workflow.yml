name: Sandbox CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    # Forks and Dependabot do not receive the sandbox secret.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted orchestration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          version: "0.8.22"
          python-version: "3.12"
      - name: Install orchestration dependencies
        run: uv sync --locked --no-dev --project ci/sandbox
      - name: Run tests in a sandbox
        env:
          CWSANDBOX_API_KEY: ${{ secrets.CWSANDBOX_API_KEY }}
          PR_REPO: ${{ github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: >-
          uv run --locked --no-dev --project ci/sandbox python ci/sandbox/run.py
          --repo "$PR_REPO" --head "$PR_HEAD" --base "$PR_BASE"
          --command 'python -m unittest discover -v'
          --output outputs
      - name: Save results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sandbox-ci-results
          path: outputs/
          if-no-files-found: warn
          retention-days: 7
