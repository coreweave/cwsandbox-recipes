[project]
name = "cwsandbox-warm-pool-recipe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cwsandbox==1.14.2"]

[project.optional-dependencies]
wandb = ["cwsandbox[wandb]==1.14.2"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
