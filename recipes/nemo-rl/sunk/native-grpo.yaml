# Defaults are supplied by the pinned NVIDIA NeMo RL v0.5.0 container.
defaults: /opt/nemo-rl/examples/configs/grpo_math_1B.yaml
grpo:
  num_prompts_per_step: 2
  num_generations_per_prompt: 4
  max_num_steps: 2
  max_num_epochs: 1
  val_period: 0
  val_at_start: false
checkpointing:
  checkpoint_dir: /results/checkpoints
  metric_name: train:reward
  save_period: 1
  keep_top_k: 2
  model_save_format: null
policy:
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  train_global_batch_size: 8
  train_micro_batch_size: 1
  logprob_batch_size: 1
  max_total_sequence_length: 256
  dtensor_cfg:
    _v2: false
  sequence_packing:
    enabled: false
  generation:
    max_new_tokens: 64
    temperature: 1.0
    vllm_cfg:
      enforce_eager: true
      gpu_memory_utilization: 0.35
data:
  dataset_name: ResponseDataset
  train_data_path: /results/arithmetic.jsonl
  val_data_path: null
  prompt_file: null
  system_prompt_file: null
  num_workers: 0
logger:
  log_dir: /results/logs
  tensorboard_enabled: true
  monitor_gpus: false
cluster:
  num_nodes: 1
  gpus_per_node: 1
