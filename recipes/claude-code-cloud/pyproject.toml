[project]
name = "claude-code-cloud-sandboxes"
version = "0.1.0"
description = "Run Claude Code cloud sessions in on-demand CoreWeave sandboxes"
requires-python = ">=3.11"
dependencies = ["cwsandbox==1.14.2", "python-dotenv==1.2.2"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.15.6"]

[tool.ruff]
line-length = 100
