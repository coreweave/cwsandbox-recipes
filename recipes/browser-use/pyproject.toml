[project]
name = "cwsandbox-browser-use-recipe"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cwsandbox[wandb]==1.17.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.12.12"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
