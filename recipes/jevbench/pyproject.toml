[project]
name = "jevbench-cwsandbox"
version = "0.1.0"
description = "Evaluate JevBench public tasks in a CPU CoreWeave sandbox"
requires-python = ">=3.12"
dependencies = ["cwsandbox==1.14.2", "python-dotenv==1.2.2"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The controller must redact errors and attempt teardown across SDK failure types.
"run.py" = ["BLE001"]
